<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل تاجر جديد</title>

  <style>
    :root{
      --brand:#0f4c81;
      --brand-dark:#0b3a63;
      --bg:#f5f7fa;
      --card:#ffffff;
      --text:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --ok:#16a34a;
      --bad:#b42318;
      --shadow:0 10px 24px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: Arial, system-ui, -apple-system, Segoe UI, Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header{
      background: var(--brand);
      color:#fff;
      padding:18px 14px;
    }
    header h1{margin:0;font-size:20px}
    header p{margin:6px 0 0;opacity:.95;font-size:13px}

    main{
      max-width: 720px;
      margin: 18px auto;
      padding: 0 12px;
    }
    .card{
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 16px;
      border: 1px solid var(--line);
    }
    .grid{
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 800px){
      .grid-2{grid-template-columns: 1fr 1fr;}
    }

    label{
      display:block;
      font-weight:700;
      margin: 10px 0 6px;
      font-size: 14px;
    }
    input, select{
      width:100%;
      padding: 11px 12px;
      border-radius: 10px;
      border:1px solid var(--line);
      font-size: 15px;
      background:#fff;
      outline: none;
    }
    input:focus, select:focus{
      border-color: rgba(15,76,129,.55);
      box-shadow: 0 0 0 4px rgba(15,76,129,.12);
    }

    .hint{
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.6;
    }

    .row{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .btn{
      background: var(--brand);
      color:#fff;
      border:none;
      padding: 12px 14px;
      border-radius: 12px;
      font-weight: 800;
      cursor: pointer;
      min-width: 160px;
    }
    .btn:hover{background: var(--brand-dark)}
    .btn:disabled{
      opacity:.65;
      cursor:not-allowed;
    }

    .msg{
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background:#fff;
      font-size: 14px;
      line-height: 1.7;
      display:none;
    }
    .msg.ok{border-color: rgba(22,163,74,.35); background: rgba(22,163,74,.06); color: var(--ok); display:block;}
    .msg.bad{border-color: rgba(180,35,24,.35); background: rgba(180,35,24,.06); color: var(--bad); display:block;}
    .msg.info{border-color: rgba(15,76,129,.25); background: rgba(15,76,129,.06); color: var(--brand); display:block;}

    footer{
      text-align:center;
      color: var(--muted);
      font-size: 12px;
      padding: 18px 12px;
    }
    .smalllink{
      color: var(--brand);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <header>
    <h1>تسجيل تاجر جديد</h1>
    <p>عبّ البيانات، وبعدها نوديك لصفحة الباقات</p>
  </header>

  <main>
    <div class="card">
      <form id="signupForm" autocomplete="on">
        <div class="grid grid-2">
          <div>
            <label for="business_name">اسم النشاط *</label>
            <input id="business_name" name="business_name" type="text" placeholder="مثال: مؤسسة عالم الفخامة" required />
          </div>

          <div>
            <label for="business_type">نوع النشاط</label>
            <select id="business_type" name="business_type">
              <option value="">اختر (اختياري)</option>
              <option value="مطعم">مطعم</option>
              <option value="مقهى">مقهى</option>
              <option value="تجزئة">تجزئة</option>
              <option value="خدمات">خدمات</option>
              <option value="عقار">عقار</option>
              <option value="مستلزمات رحلات">مستلزمات رحلات</option>
              <option value="أثاث">أثاث</option>
              <option value="أخرى">أخرى</option>
            </select>
          </div>
        </div>

        <div class="grid grid-2">
          <div>
            <label for="city">المدينة</label>
            <input id="city" name="city" type="text" placeholder="مثال: الرياض/جدة" />
          </div>

          <div>
            <label for="whatsapp">رقم الواتساب *</label>
            <input id="whatsapp" name="whatsapp" type="text" placeholder="مثال: 05xxxxxxxx" required />
            <div class="hint">يفضّل كتابة الرقم بصيغة محلية: 05xxxxxxxx</div>
          </div>
        </div>

        <div>
          <label for="email">البريد الإلكتروني *</label>
          <input id="email" name="email" type="email" placeholder="name@example.com" required />
        </div>

        <div class="row">
          <button id="submitBtn" class="btn" type="submit">تسجيل</button>
          <div class="hint">
            لديك حساب؟ <a class="smalllink" href="renew.html">تجديد / دخول</a>
          </div>
        </div>

        <p id="statusMsg" class="msg"></p>
      </form>
    </div>
  </main>

  <footer>
    © منصة التاجر الذكية
  </footer>

  <script>
    // ✅ 1) Project URL (عدّلها إذا اختلفت)
    const SUPABASE_URL = "https://udsqvnvjktggdtzpoyts.supabase.co";

    // ✅ 2) Edge Function (تسجيل التاجر)
    // لازم تكون عندك Edge Function اسمها: register-merchant
    const REGISTER_URL = `${SUPABASE_URL}/functions/v1/register-merchant`;

    const form = document.getElementById("signupForm");
    const msgEl = document.getElementById("statusMsg");
    const btn = document.getElementById("submitBtn");

    function showMsg(type, text){
      msgEl.className = "msg " + type;
      msgEl.textContent = text;
    }

    function sanitizePhone(v){
      return (v || "").toString().trim().replace(/\s+/g, "");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const business_name = document.getElementById("business_name").value.trim();
      const business_type = document.getElementById("business_type").value.trim();
      const city = document.getElementById("city").value.trim();
      const email = document.getElementById("email").value.trim();
      const whatsapp = sanitizePhone(document.getElementById("whatsapp").value);

      // تحقق بسيط قبل الإرسال
      if (!business_name || !email || !whatsapp) {
        showMsg("bad", "فضلاً أكمل الحقول المطلوبة: اسم النشاط + البريد + الواتساب");
        return;
      }

      btn.disabled = true;
      showMsg("info", "جاري التسجيل...");

      const payload = { business_name, business_type, city, email, whatsapp };

      try {
        const res = await fetch(REGISTER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await res.json().catch(() => ({}));

        // متوقع من الدالة ترجع:
        // { success: true, merchant_id: "uuid...", message: "..." }
        if (!res.ok || !data || data.success !== true) {
          const errText = (data && (data.error || data.message)) ? (data.error || data.message) : "فشل التسجيل";
          showMsg("bad", errText);
          btn.disabled = false;
          return;
        }

        if (!data.merchant_id) {
          showMsg("bad", "تم التسجيل لكن لم يصل merchant_id من السيرفر. راجع دالة register-merchant.");
          btn.disabled = false;
          return;
        }

        // حفظ المعرف
        localStorage.setItem("merchant_id", data.merchant_id);

        showMsg("ok", "تم التسجيل ✅ جاري تحويلك إلى صفحة الباقات...");

        // تحويل لصفحة الباقات
        setTimeout(() => {
          window.location.href = `pricing.html?merchant_id=${encodeURIComponent(data.merchant_id)}`;
        }, 700);

      } catch (err) {
        showMsg("bad", "خطأ اتصال. تأكد من الرابط أو من حالة Supabase وحاول مرة ثانية.");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
